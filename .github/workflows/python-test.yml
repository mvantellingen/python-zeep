name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python 3.14
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: pip install tox

    - name: Validate formatting
      run: tox -e format

  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # # TODO: Remove Windows exclusion when binary wheel available for lxml
        # exclude:
        #   - { platform: windows-latest, python-version: "3.14" }


    steps:
    - name: Install system dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install libssl-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl libxslt1-dev pkg-config

    - name: Install system dependencies
      if: matrix.platform == 'macos-latest'
      run: |
        brew install libxmlsec1 libxslt pkgconfig

    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      run: tox
      env:
          PLATFORM: ${{ matrix.platform }}

    - name: Prepare artifacts
      run: mkdir .coverage-data && mv .coverage.* .coverage-data/

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-data-${{ matrix.platform }}-${{ matrix.python-version }}
        path: .coverage-data/.coverage.*
        include-hidden-files: true
        retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: coverage-data-*
        merge-multiple: true
        path: .

    - name: Set up Python 3.14
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Prepare Coverage report
      run: tox -e coverage-report
