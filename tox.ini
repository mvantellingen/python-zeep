[tox]
envlist = py{310,311,312,313,314}-{mac,linux,windows},pypy

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314


[testenv]
platform =
    mac: darwin
    windows: win32
    linux: linux
extras =
    test
    py{310,311,312,313}-{mac,linux}: xmlsec # Skip xmlsec on Python 3.14 for now
    py{310,311,312,313,314}: async
deps =
    py{310,311,312,313,314}: aioresponses==0.5.0
    py{310,311,312,313,314}: aiohttp==3.7.4
    py{310,311,312,313,314}: pytest-asyncio>=0.24,<1.0
commands = coverage run --parallel -m pytest {posargs}

[testenv:pypy]
extras =
    test
    xmlsec
commands = python -m pytest {posargs}


[testenv:format]
basepython = python3.13
deps =
    black
    isort[toml]
skip_install = true
commands =
    isort --check-only src tests
    black --check src/ tests/


[testenv:coverage-report]
basepython = python3.13
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage xml
    coverage report
